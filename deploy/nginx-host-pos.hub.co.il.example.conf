# דוגמה ל-Nginx על השרת (מחוץ ל-Docker) — xCloud / manual
# העתק/התאם ל-vhost של pos.hub.co.il

server {
    listen 443 ssl http2;
    server_name pos.hub.co.il;

    # ssl_certificate ... (מנוהל ב-xCloud / Let's Encrypt)

    # /api/* → hub-pos-api container (bot-facing REST API, port 8787) - MUST come before the
    # catch-all "location /" below since nginx picks the most specific matching prefix.
    location /api/ {
        # חשבוניות ספק נשלחות דרך הנתיב הזה; ברירת המחדל 1m הייתה דוחה אותן
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
