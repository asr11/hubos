server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # API — Fastify backend (Docker service hub-pos-api)
    location /api/ {
        # Supplier invoices are uploaded through this proxy; the 1m default
        # would reject them with 413 before the request reaches Fastify.
        client_max_body_size 20m;
        proxy_pass http://hub-pos-api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # SPA — React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundled mime.types has no .mjs entry, so the pdf.js worker was served
    # as application/octet-stream and refused under strict MIME checking.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache hashed Vite assets
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
