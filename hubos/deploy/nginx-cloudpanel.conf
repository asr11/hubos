# ==============================================================================
# OS HUB v2 (hubos) — CloudPanel Nginx Vhost Configuration
# Target root: /home/hub-os/htdocs/os.hub.co.il/public
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    {{ssl_certificate_key}}
    {{ssl_certificate}}

    server_name os.hub.co.il hubos.hub.co.il;

    # Strict public document root — storage/, app/, database/, bin/ live outside public/
    root /home/hub-os/htdocs/os.hub.co.il/public;
    index index.php;

    access_log /home/hub-os/logs/nginx/access.log main;
    error_log  /home/hub-os/logs/nginx/error.log;

    if ($scheme != "https") {
        rewrite ^ https://$host$uri permanent;
    }

    # Cloudflare real client IP restoration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Hard block any attempt to reach internal directories or hidden files
    location ~ ^/(storage|database|app|bin|tests|deploy|views|docs|lang)/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(sqlite|sqlite3|sql|md|sh|log|ini|conf)$ {
        deny all;
        return 404;
    }

    # Static assets
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Front controller routing
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HUBOS_ENV "production";
        fastcgi_param HUBOS_COOKIE_SECURE "1";
        fastcgi_read_timeout 60s;
        fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    }
}
